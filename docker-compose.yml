version: '3.8'

services:
  # Aplicação principal
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./logs:/var/log/app
      - ./certs:/app/certs:ro
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=suno_user
      - DB_PASSWORD=suno_password
      - DB_NAME=suno_wallets
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GIN_MODE=release
      - B3_TIMEOUT_SECONDS=30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - suno-network
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 208.67.222.222
    extra_hosts:
      - "login.microsoftonline.com:20.190.173.1"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./misc/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./misc/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    depends_on:
      - app
      - node-exporter
      - cadvisor
    networks:
      - suno-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - suno-network
    depends_on:
      - prometheus

  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"
    networks:
      - suno-network

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    networks:
      - suno-network

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./misc/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/app
    command: [ "--config.file=/etc/promtail/config.yml" ]
    networks:
      - suno-network
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    networks:
      - suno-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8082:8080"
    networks:
      - suno-network

  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=suno_wallets
      - POSTGRES_USER=suno_user
      - POSTGRES_PASSWORD=suno_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U suno_user -d suno_wallets" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suno-network
    restart: unless-stopped

  # Redis para cache e sessões
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass suno_redis_password
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - suno-network
    restart: unless-stopped

  # Adminer para gerenciamento do banco (opcional - apenas desenvolvimento)
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - suno-network
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
  logs:


networks:
  suno-network:
    driver: bridge
