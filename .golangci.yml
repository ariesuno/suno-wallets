run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused
    - errcheck
  disable:
    - revive
    - misspell

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: suno-wallets

issues:
  exclude-use-default: true
  max-issues-per-linter: 50
  max-same-issues: 3
  exclude:
    - "should have a package comment"
    - "exported .* should have comment"
    - "comment on exported .* should be of the form"

output:
  format: colored-line-number