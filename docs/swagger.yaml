      - application/json
      description: 'Executa fluxo completo e inteligente de sincronização B3: analisa
        automaticamente o status do cliente (novo vs existente), escolhe a estratégia
        ideal (ingestão histórica completa vs incremental vs reativação híbrida),
        executa todo o pipeline de ingestão e normalização, e opcionalmente realiza
        reconciliação. Este é o endpoint unificado para processamento completo de
        dados B3.'
