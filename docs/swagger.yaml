basePath: /api/v1
definitions:
  src_api_controllers.HealthResponse:
    properties:
      services:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
      timestamp:
        type: string
      version:
        type: string
    type: object
  src_api_controllers_b3.completeSyncRequest:
    properties:
      assetTypes:
        items:
          type: string
        type: array
      cpf:
        type: string
      dataTypes:
        items:
          type: string
        type: array
      dryRun:
        type: boolean
      force:
        type: boolean
      includeReconciliation:
        type: boolean
    required:
    - cpf
    type: object
  src_api_controllers_b3.ingestRequest:
    properties:
      assetType:
        description: 'default: equity'
        type: string
      cpf:
        type: string
      dataType:
        description: transactions|positions
        type: string
      dryRun:
        type: boolean
      end:
        type: string
      fetchAllPages:
        type: boolean
      force:
        type: boolean
      start:
        type: string
    required:
    - cpf
    - dataType
    - end
    - start
    type: object
  src_api_controllers_b3.normalizeRequest:
    properties:
      assetType:
        type: string
      cpf:
        type: string
      dataType:
        type: string
      dryRun:
        type: boolean
      end:
        type: string
      force:
        type: boolean
      start:
        type: string
    required:
    - cpf
    - dataType
    - end
    - start
    type: object
  src_api_controllers_b3.resetAndRefetchRequest:
    properties:
      assetTypes:
        items:
          type: string
        type: array
      confirm:
        description: must be RESET_AND_REFETCH
        type: string
      confirmHard:
        description: must be YES_DELETE when hard-delete
        type: string
      cpf:
        type: string
      dataTypes:
        items:
          type: string
        type: array
      dryRun:
        type: boolean
      endOverride:
        type: string
      force:
        type: boolean
      mode:
        description: archive|hard-delete
        type: string
      startOverride:
        type: string
    required:
    - cpf
    type: object
  src_api_controllers_b3.runRequest:
    properties:
      assetTypes:
        example:
        - equity
        items:
          type: string
        type: array
      cpf:
        example: "12345678901"
        type: string
      dataTypes:
        example:
        - transactions
        - positions
        items:
          type: string
        type: array
      dryRun:
        type: boolean
      force:
        type: boolean
      limit:
        example: 100
        type: integer
      scope:
        example: single|tenant
        type: string
    type: object
  suno-wallets_src_application_b3_e2e.Summary:
    properties:
      dryRun:
        type: boolean
      durationMs:
        format: int64
        type: integer
      finishedAt:
        type: string
      force:
        type: boolean
      mode:
        type: string
      normalized:
        properties:
          errors:
            type: integer
          inserted:
            type: integer
          skipped:
            type: integer
          updated:
            type: integer
        type: object
      raw:
        properties:
          errors:
            type: integer
          monthsProcessed:
            type: integer
          pagesProcessed:
            type: integer
          saved:
            type: integer
          skipped:
            type: integer
        type: object
      startedAt:
        type: string
    type: object
  suno-wallets_src_application_b3_incremental.Summary:
    properties:
      dryRun:
        type: boolean
      durationMs:
        type: integer
      finishedAt:
        type: string
      force:
        type: boolean
      positions:
        $ref: '#/definitions/suno-wallets_src_application_b3_incremental.TypeSummary'
      startedAt:
        type: string
      transactions:
        $ref: '#/definitions/suno-wallets_src_application_b3_incremental.TypeSummary'
    type: object
  suno-wallets_src_application_b3_incremental.TypeSummary:
    properties:
      from:
        type: string
      normalized:
        $ref: '#/definitions/suno-wallets_src_application_b3_normalize.Summary'
      raw:
        $ref: '#/definitions/suno-wallets_src_application_b3_ingest.Summary'
      to:
        type: string
    type: object
  suno-wallets_src_application_b3_ingest.Summary:
    properties:
      dryRun:
        type: boolean
      errors:
        type: integer
      force:
        type: boolean
      monthsProcessed:
        type: integer
      pagesProcessed:
        type: integer
      saved:
        type: integer
      skipped:
        type: integer
    type: object
  suno-wallets_src_application_b3_normalize.Summary:
    properties:
      errors:
        type: integer
      inserted:
        type: integer
      rawProcessed:
        type: integer
      skipped:
        type: integer
      updated:
        type: integer
    type: object
  suno-wallets_src_application_b3_reactivation.ReactivationPlan:
    properties:
      estimatedMinutes:
        type: integer
      gapDays:
        type: integer
      lastSyncDate:
        type: string
      reason:
        type: string
      steps:
        items:
          $ref: '#/definitions/suno-wallets_src_application_b3_reactivation.ReactivationStep'
        type: array
      strategy:
        $ref: '#/definitions/suno-wallets_src_application_b3_reactivation.ReactivationStrategy'
    type: object
  suno-wallets_src_application_b3_reactivation.ReactivationStep:
    properties:
      dataTypes:
        items:
          type: string
        type: array
      description:
        type: string
      fromDate:
        type: string
      toDate:
        type: string
      type:
        description: '"historical_monthly", "incremental_daily"'
        type: string
    type: object
  suno-wallets_src_application_b3_reactivation.ReactivationStrategy:
    enum:
    - FULL_HISTORICAL
    - INCREMENTAL_ONLY
    - HYBRID_OPTIMIZED
    type: string
    x-enum-comments:
      StrategyFullHistorical: Cliente novo - histórico completo
      StrategyHybridOptimized: Gap grande - mix de consolidado + incremental
      StrategyIncrementalOnly: Gap pequeno - só incremental
    x-enum-descriptions:
    - Cliente novo - histórico completo
    - Gap pequeno - só incremental
    - Gap grande - mix de consolidado + incremental
    x-enum-varnames:
    - StrategyFullHistorical
    - StrategyIncrementalOnly
    - StrategyHybridOptimized
  suno-wallets_src_application_b3_sync.CompleteSyncResult:
    properties:
      clientStatus:
        description: new, existing_current, existing_outdated
        type: string
      dataSummary:
        $ref: '#/definitions/suno-wallets_src_application_b3_sync.DataSummary'
      durationMs:
        type: integer
      e2eResult:
        $ref: '#/definitions/suno-wallets_src_application_b3_e2e.Summary'
      errorMessage:
        type: string
      executionPlan:
        type: string
      finishedAt:
        type: string
      incrementalResult:
        $ref: '#/definitions/suno-wallets_src_application_b3_incremental.Summary'
      newDataIngested:
        type: boolean
      processedDataTypes:
        items:
          type: string
        type: array
      reactivationPlan:
        $ref: '#/definitions/suno-wallets_src_application_b3_reactivation.ReactivationPlan'
      reconciliationResult:
        additionalProperties: true
        type: object
      startedAt:
        type: string
      strategy:
        type: string
      success:
        type: boolean
    type: object
  suno-wallets_src_application_b3_sync.DataSummary:
    properties:
      inconsistenciesFound:
        type: integer
      positionsNormalized:
        type: integer
      rawRecordsIngested:
        type: integer
      transactionsNormalized:
        type: integer
    type: object
  suno-wallets_src_application_dtos.CreateWalletRequest:
    properties:
      allow_debit:
        type: boolean
      created_by:
        type: string
      currency:
        type: string
      daily_limit:
        type: integer
      description:
        type: string
      is_default:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      monthly_limit:
        type: integer
      name:
        maxLength: 255
        minLength: 1
        type: string
      owner_id:
        type: string
      owner_type:
        type: string
      tenant_id:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/suno-wallets_src_domain_entities.WalletType'
        enum:
        - personal
        - business
        - corporate
    required:
    - created_by
    - currency
    - name
    - owner_id
    - owner_type
    - tenant_id
    - type
    type: object
  suno-wallets_src_application_dtos.ListWalletsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/suno-wallets_src_application_dtos.WalletResponse'
        type: array
      meta:
        $ref: '#/definitions/suno-wallets_src_application_dtos.PaginationMeta'
    type: object
  suno-wallets_src_application_dtos.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  suno-wallets_src_application_dtos.UpdateWalletRequest:
    properties:
      allow_debit:
        type: boolean
      daily_limit:
        type: integer
      description:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      monthly_limit:
        type: integer
      name:
        type: string
      status:
        $ref: '#/definitions/suno-wallets_src_domain_entities.WalletStatus'
      tenant_id:
        type: string
      updated_by:
        type: string
    required:
    - id
    - tenant_id
    type: object
  suno-wallets_src_application_dtos.WalletResponse:
    properties:
      allow_debit:
        type: boolean
      balance:
        type: integer
      balance_in_reais:
        type: number
      created_at:
        type: string
      created_by:
        type: string
      currency:
        type: string
      daily_limit:
        type: integer
      daily_limit_reais:
        type: number
      description:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      monthly_limit:
        type: integer
      monthly_limit_reais:
        type: number
      name:
        type: string
      owner_id:
        type: string
      owner_type:
        type: string
      status:
        $ref: '#/definitions/suno-wallets_src_domain_entities.WalletStatus'
      tenant_id:
        type: string
      type:
        $ref: '#/definitions/suno-wallets_src_domain_entities.WalletType'
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  suno-wallets_src_domain_entities.WalletStatus:
    enum:
    - active
    - inactive
    - blocked
    - suspended
    type: string
    x-enum-varnames:
    - WalletStatusActive
    - WalletStatusInactive
    - WalletStatusBlocked
    - WalletStatusSuspended
  suno-wallets_src_domain_entities.WalletType:
    enum:
    - personal
    - business
    - corporate
    type: string
    x-enum-varnames:
    - WalletTypePersonal
    - WalletTypeBusiness
    - WalletTypeCorporate
  suno-wallets_src_shared_dto.PositionsPreviewResponse:
    properties:
      asset_type:
        type: string
      end:
        type: string
      pages:
        type: integer
      payloads:
        items: {}
        type: array
      start:
        type: string
    type: object
  suno-wallets_src_shared_dto.TransactionsPreviewResponse:
    properties:
      asset_type:
        type: string
      end:
        type: string
      pages:
        type: integer
      payloads:
        items: {}
        type: array
      start:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: Suporte API
    url: http://www.swagger.io/support
  description: Sistema de carteiras digitais multi-tenant desenvolvido em Go
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Suno Wallets API
  version: "1.0"
paths:
  /admin/backoffice/actions:
    get:
      description: Retorna lista paginada de ações administrativas com filtros opcionais
        por CPF, tipo de ação e status.
      parameters:
      - description: ID do inquilino (tenant)
        example: status_invest
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Filtrar por CPF específico
        example: "12345678901"
        in: query
        name: cpf
        type: string
      - description: Filtrar por tipo de ação
        example: DELETE_CLIENT_DATA
        in: query
        name: action
        type: string
      - description: Filtrar por status (PENDING, CONFIRMED, EXPIRED)
        example: PENDING
        in: query
        name: status
        type: string
      - description: 'Número da página (padrão: 1)'
        example: 1
        in: query
        name: page
        type: integer
      - description: 'Tamanho da página (padrão: 50)'
        example: 50
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Lista paginada de ações administrativas
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Listar ações administrativas (Admin)
      tags:
      - Admin Backoffice
  /admin/backoffice/actions/{id}:
    get:
      description: Retorna detalhes completos de uma ação administrativa específica
        identificada pelo ID.
      parameters:
      - description: ID do inquilino (tenant)
        example: status_invest
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: ID da ação administrativa (UUID)
        example: 123e4567-e89b-12d3-a456-426614174000
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detalhes da ação administrativa
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obter detalhes de ação administrativa (Admin)
      tags:
      - Admin Backoffice
  /admin/backoffice/actions/confirm:
    post:
      description: Confirma e executa uma ação administrativa previamente solicitada
        usando ID e token de confirmação. Requer role ADMIN.
      parameters:
      - description: Role do usuário (deve ser ADMIN)
        example: ADMIN
        in: header
        name: X-Role
        required: true
        type: string
      - description: ID da ação solicitada
        example: 123e4567-e89b-12d3-a456-426614174000
        in: query
        name: id
        required: true
        type: string
      - description: Token de confirmação gerado na solicitação
        example: abc123def456
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Ação confirmada e executada
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ID/token inválido ou ação expirada
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Acesso negado - requer role ADMIN
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirmar ação administrativa
      tags:
      - Admin Backoffice
  /admin/backoffice/actions/request:
    post:
      consumes:
      - application/json
      description: Cria uma solicitação de ação administrativa que requer confirmação
        posterior. Suporta TTL configurável e payload personalizado. Requer role ADMIN
        ou SUPPORT.
      parameters:
      - description: ID do inquilino (tenant)
        example: status_invest
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Role do usuário (ADMIN ou SUPPORT)
        example: ADMIN
        in: header
        name: X-Role
        required: true
        type: string
      - description: Dados da solicitação de ação
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Ação solicitada com token de confirmação
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Role insuficiente - requer ADMIN ou SUPPORT
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Solicitar ação administrativa
      tags:
      - Admin Backoffice
  /admin/backoffice/export/ledger:
    get:
      description: Exporta o ledger completo de operações de um cliente específico.
        Permite filtrar dados da B3 e configurar limite de registros.
      parameters:
      - description: ID do inquilino (tenant)
        example: status_invest
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: CPF do cliente (11 dígitos, apenas números)
        example: "12345678901"
        in: query
        name: cpf
        required: true
        type: string
      - description: 'Limite de registros (padrão: 50000)'
        example: 50000
        in: query
        name: limit
        type: integer
      - description: 'Excluir dados da B3 do export (padrão: false)'
        example: false
        in: query
        name: excludeB3
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Ledger exportado do cliente
          schema:
            additionalProperties: true
            type: object
        "400":
          description: CPF obrigatório
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Exportar ledger do cliente (Admin)
      tags:
      - Admin Backoffice
  /admin/backoffice/profile:
    get:
      description: Retorna informações detalhadas do perfil de um cliente, incluindo
        dados de sincronização, políticas ativas e estatísticas de operações.
      parameters:
      - description: ID do inquilino (tenant)
        example: status_invest
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: CPF do cliente (11 dígitos, apenas números)
        example: "12345678901"
        in: query
        name: cpf
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Perfil completo do cliente
          schema:
            additionalProperties: true
            type: object
        "400":
          description: CPF obrigatório ou tenant ausente
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Perfil completo do cliente (Admin)
      tags:
      - Admin Backoffice
  /admin/backoffice/search:
    get:
      description: Busca clientes e informações relacionadas usando termo de pesquisa.
        Suporta busca por CPF, nome, email ou outras informações do cliente.
      parameters:
      - description: ID do inquilino (tenant)
        example: status_invest
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Termo de busca (CPF, nome, email, etc.)
        example: "12345678901"
        in: query
        name: query
        type: string
      - description: 'Limite de resultados (padrão: 20)'
        example: 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Resultados da busca
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Buscar clientes e dados (Admin)
      tags:
      - Admin Backoffice
  /admin/client/policy:
    get:
      description: Retorna a política de fonte de dados ativa para um cliente específico
        (B3_ONLY, MANUAL_ONLY ou HYBRID).
      parameters:
      - description: ID do inquilino (tenant)
        example: status_invest
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: CPF do cliente (11 dígitos, apenas números)
        example: "12345678901"
        in: query
        name: cpf
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Política ativa do cliente
          schema:
            additionalProperties: true
            type: object
        "400":
          description: CPF obrigatório
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obter política do cliente (Admin)
      tags:
      - Client Policy
    post:
      consumes:
      - application/json
      description: Cria ou atualiza a política de fonte de dados para um cliente.
        Suporta B3_ONLY, MANUAL_ONLY e HYBRID.
      parameters:
      - description: ID do inquilino (tenant)
        example: status_invest
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Dados da política
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Política configurada com sucesso
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Definir política do cliente (Admin)
      tags:
      - Client Policy
  /admin/client/policy/audit:
    get:
      description: Retorna o histórico de mudanças na política de fonte de dados de
        um cliente específico.
      parameters:
      - description: ID do inquilino (tenant)
        example: status_invest
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: CPF do cliente (11 dígitos, apenas números)
        example: "12345678901"
        in: query
        name: cpf
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Histórico de mudanças da política
          schema:
            additionalProperties: true
            type: object
        "400":
          description: CPF obrigatório
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Histórico de mudanças de política (Admin)
      tags:
      - Client Policy
  /admin/client/policy/dry-run:
    post:
      consumes:
      - application/json
      description: Simula o impacto de alterar a política de um cliente, mostrando
        jobs afetados, endpoints bloqueados e mudanças no sistema.
      parameters:
      - description: ID do inquilino (tenant)
        example: status_invest
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Simulação de mudança
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Análise de impacto da mudança
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Dados inválidos
          schema:
            additionalProperties:
              type: string
            type: object
