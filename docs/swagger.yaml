basePath: /api/v1
definitions:
  b3.ingestRequest:
    properties:
      assetType:
        description: 'default: equity'
        type: string
      cpf:
        type: string
      dataType:
        description: transactions|positions
        type: string
      dryRun:
        type: boolean
      end:
        type: string
      fetchAllPages:
        type: boolean
      force:
        type: boolean
      start:
        type: string
    required:
    - cpf
    - dataType
    - end
    - start
    type: object
  controllers.HealthResponse:
    properties:
      services:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
      timestamp:
        type: string
      version:
        type: string
    type: object
  dto.PositionsPreviewResponse:
    properties:
      asset_type:
        type: string
      end:
        type: string
      pages:
        type: integer
      payloads:
        items: {}
        type: array
      start:
        type: string
    type: object
  dto.TransactionsPreviewResponse:
    properties:
      asset_type:
        type: string
      end:
        type: string
      pages:
        type: integer
      payloads:
        items: {}
        type: array
      start:
        type: string
    type: object
  dtos.CreateWalletRequest:
    properties:
      allow_debit:
        type: boolean
      created_by:
        type: string
      currency:
        type: string
      daily_limit:
        type: integer
      description:
        type: string
      is_default:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      monthly_limit:
        type: integer
      name:
        maxLength: 255
        minLength: 1
        type: string
      owner_id:
        type: string
      owner_type:
        type: string
      tenant_id:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/entities.WalletType'
        enum:
        - personal
        - business
        - corporate
    required:
    - created_by
    - currency
    - name
    - owner_id
    - owner_type
    - tenant_id
    - type
    type: object
  dtos.ListWalletsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.WalletResponse'
        type: array
      meta:
        $ref: '#/definitions/dtos.PaginationMeta'
    type: object
  dtos.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dtos.UpdateWalletRequest:
    properties:
      allow_debit:
        type: boolean
      daily_limit:
        type: integer
      description:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      monthly_limit:
        type: integer
      name:
        type: string
      status:
        $ref: '#/definitions/entities.WalletStatus'
      tenant_id:
        type: string
      updated_by:
        type: string
    required:
    - id
    - tenant_id
    type: object
  dtos.WalletResponse:
    properties:
      allow_debit:
        type: boolean
      balance:
        type: integer
      balance_in_reais:
        type: number
      created_at:
        type: string
      created_by:
        type: string
      currency:
        type: string
      daily_limit:
        type: integer
      daily_limit_reais:
        type: number
      description:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      monthly_limit:
        type: integer
      monthly_limit_reais:
        type: number
      name:
        type: string
      owner_id:
        type: string
      owner_type:
        type: string
      status:
        $ref: '#/definitions/entities.WalletStatus'
      tenant_id:
        type: string
      type:
        $ref: '#/definitions/entities.WalletType'
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  entities.WalletStatus:
    enum:
    - active
    - inactive
    - blocked
    - suspended
    type: string
    x-enum-varnames:
    - WalletStatusActive
    - WalletStatusInactive
    - WalletStatusBlocked
    - WalletStatusSuspended
  entities.WalletType:
    enum:
    - personal
    - business
    - corporate
    type: string
    x-enum-varnames:
    - WalletTypePersonal
    - WalletTypeBusiness
    - WalletTypeCorporate
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: Suporte API
    url: http://www.swagger.io/support
  description: Sistema de carteiras digitais multi-tenant desenvolvido em Go
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Suno Wallets API
  version: "1.0"
paths:
  /b3/fetch/historical:
    post:
      consumes:
      - application/json
      description: Busca e persiste RAW por janelas mensais, evitando duplicidade
        por hash
      parameters:
      - description: Parâmetros
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/b3.ingestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ingestão histórica de RAW (transactions v2 / positions v3)
      tags:
      - B3 Data (Persistence)
  /b3/fetch/positions/preview:
    get:
      description: Busca posições por período e tipo de ativo na B3 e retorna o payload
        bruto (consolidado), sem persistir.
      parameters:
      - description: CPF (11 dígitos)
        example: "12345678901"
        in: query
        name: cpf
        required: true
        type: string
      - description: Data inicial (YYYY-MM-DD)
        example: "2024-01-01"
        in: query
        name: start
        required: true
        type: string
      - description: Data final (YYYY-MM-DD)
        example: "2024-01-31"
        in: query
        name: end
        required: true
        type: string
      - description: Tipo de ativo (equity...) — somente equity implementado agora
        example: equity
        in: query
        name: assetType
        type: string
      - description: Página inicial (>= 1), padrão 1
        example: 1
        in: query
        name: page
        type: integer
      - description: Se true, pagina até o fim
        example: false
        in: query
        name: fetchAllPages
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Exemplo de sucesso
          schema:
            $ref: '#/definitions/dto.PositionsPreviewResponse'
        "400":
          description: Parâmetros inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Não autorizado / Token inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Acesso negado / Sem permissão
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Limite de requisições excedido (Retry-After)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Preview de posições v3 (sem persistência)
      tags:
      - B3 Data
  /b3/fetch/transactions/preview:
    get:
      description: Busca transações por período e tipo de ativo na B3 e retorna o
        payload bruto (consolidado), sem persistir.
      parameters:
      - description: CPF (11 dígitos)
        example: "12345678901"
        in: query
        name: cpf
        required: true
        type: string
      - description: Data inicial (YYYY-MM-DD)
        example: "2024-01-01"
        in: query
        name: start
        required: true
        type: string
      - description: Data final (YYYY-MM-DD)
        example: "2024-01-31"
        in: query
        name: end
        required: true
        type: string
      - description: Tipo de ativo (equity|fii|bdr|...) — somente equity implementado
          agora
        example: equity
        in: query
        name: assetType
        type: string
      - description: Página inicial (>= 1), padrão 1
        example: 1
        in: query
        name: page
        type: integer
      - description: Se true, pagina até o fim
        example: false
        in: query
        name: fetchAllPages
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Exemplo de sucesso
          schema:
            $ref: '#/definitions/dto.TransactionsPreviewResponse'
        "400":
          description: Parâmetros inválidos
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Preview de transações v2 (sem persistência)
      tags:
      - B3 Data
  /b3/health/auth:
    get:
      description: Verifica se as variáveis de ambiente de auth estão presentes (não
        valida contra B3)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: B3 auth health
      tags:
      - B3
  /health:
    get:
      description: Verifica se a aplicação e seus serviços dependentes estão funcionando
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/controllers.HealthResponse'
      summary: Health check
      tags:
      - health
  /live:
    get:
      description: Verifica se a aplicação está viva (para Kubernetes)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Liveness check
      tags:
      - health
  /ready:
    get:
      description: Verifica se a aplicação está pronta para receber requisições
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Readiness check
      tags:
      - health
  /wallets:
    get:
      description: Lista carteiras com filtros opcionais e paginação
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: ID do proprietário
        in: query
        name: owner_id
        type: string
      - description: Status da carteira
        in: query
        name: status
        type: string
      - description: Tipo da carteira
        in: query
        name: type
        type: string
      - default: 1
        description: Página
        in: query
        name: page
        type: integer
      - default: 10
        description: Limite por página
        in: query
        name: limit
        type: integer
      - description: Busca por nome
        in: query
        name: search
        type: string
      - description: Campo para ordenação
        in: query
        name: sort_by
        type: string
      - description: Ordenação decrescente
        in: query
        name: sort_desc
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.ListWalletsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Listar carteiras
      tags:
      - wallets
    post:
      consumes:
      - application/json
      description: Cria uma nova carteira digital para um usuário
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: Dados da carteira
        in: body
        name: wallet
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateWalletRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.WalletResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Criar carteira
      tags:
      - wallets
  /wallets/{id}:
    delete:
      description: Remove uma carteira (soft delete)
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: ID da carteira
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Deletar carteira
      tags:
      - wallets
    get:
      description: Busca uma carteira específica por ID
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: ID da carteira
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.WalletResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Buscar carteira
      tags:
      - wallets
    put:
      consumes:
      - application/json
      description: Atualiza uma carteira existente
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: ID da carteira
        in: path
        name: id
        required: true
        type: string
      - description: Dados para atualização
        in: body
        name: wallet
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateWalletRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.WalletResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Atualizar carteira
      tags:
      - wallets
  /wallets/owner/{owner_id}:
    get:
      description: Busca todas as carteiras de um proprietário específico
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: ID do proprietário
        in: path
        name: owner_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dtos.WalletResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Buscar carteiras por proprietário
      tags:
      - wallets
securityDefinitions:
  TenantID:
    description: ID do inquilino para multi-tenancy
    in: header
    name: X-Tenant-ID
    type: apiKey
swagger: "2.0"
