basePath: /api/v1
definitions:
  b3.ingestRequest:
    properties:
      assetType:
        description: 'default: equity'
        type: string
      cpf:
        type: string
      dataType:
        description: transactions|positions
        type: string
      dryRun:
        type: boolean
      end:
        type: string
      fetchAllPages:
        type: boolean
      force:
        type: boolean
      start:
        type: string
    required:
    - cpf
    - dataType
    - end
    - start
    type: object
  b3.normalizeRequest:
    properties:
      assetType:
        type: string
      cpf:
        type: string
      dataType:
        type: string
      dryRun:
        type: boolean
      end:
        type: string
      force:
        type: boolean
      start:
        type: string
    required:
    - cpf
    - dataType
    - end
    - start
    type: object
  b3.runRequest:
    properties:
      assetTypes:
        example:
        - equity
        items:
          type: string
        type: array
      cpf:
        example: "12345678901"
        type: string
      dataTypes:
        example:
        - transactions
        - positions
        items:
          type: string
        type: array
      dryRun:
        type: boolean
      force:
        type: boolean
      limit:
        example: 100
        type: integer
      scope:
        example: single|tenant
        type: string
    type: object
  controllers.HealthResponse:
    properties:
      services:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
      timestamp:
        type: string
      version:
        type: string
    type: object
  dto.PositionsPreviewResponse:
    properties:
      asset_type:
        type: string
      end:
        type: string
      pages:
        type: integer
      payloads:
        items: {}
        type: array
      start:
        type: string
    type: object
  dto.TransactionsPreviewResponse:
    properties:
      asset_type:
        type: string
      end:
        type: string
      pages:
        type: integer
      payloads:
        items: {}
        type: array
      start:
        type: string
    type: object
  dtos.CreateWalletRequest:
    properties:
      allow_debit:
        type: boolean
      created_by:
        type: string
      currency:
        type: string
      daily_limit:
        type: integer
      description:
        type: string
      is_default:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      monthly_limit:
        type: integer
      name:
        maxLength: 255
        minLength: 1
        type: string
      owner_id:
        type: string
      owner_type:
        type: string
      tenant_id:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/entities.WalletType'
        enum:
        - personal
        - business
        - corporate
    required:
    - created_by
    - currency
    - name
    - owner_id
    - owner_type
    - tenant_id
    - type
    type: object
  dtos.ListWalletsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/dtos.WalletResponse'
        type: array
      meta:
        $ref: '#/definitions/dtos.PaginationMeta'
    type: object
  dtos.PaginationMeta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dtos.UpdateWalletRequest:
    properties:
      allow_debit:
        type: boolean
      daily_limit:
        type: integer
      description:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      monthly_limit:
        type: integer
      name:
        type: string
      status:
        $ref: '#/definitions/entities.WalletStatus'
      tenant_id:
        type: string
      updated_by:
        type: string
    required:
    - id
    - tenant_id
    type: object
  dtos.WalletResponse:
    properties:
      allow_debit:
        type: boolean
      balance:
        type: integer
      balance_in_reais:
        type: number
      created_at:
        type: string
      created_by:
        type: string
      currency:
        type: string
      daily_limit:
        type: integer
      daily_limit_reais:
        type: number
      description:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      monthly_limit:
        type: integer
      monthly_limit_reais:
        type: number
      name:
        type: string
      owner_id:
        type: string
      owner_type:
        type: string
      status:
        $ref: '#/definitions/entities.WalletStatus'
      tenant_id:
        type: string
      type:
        $ref: '#/definitions/entities.WalletType'
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  reports.RawDateRangeResponse:
    type: object
    properties:
      cpf: { type: string }
      from: { type: string }
      to: { type: string }
      dataTypes:
        type: array
        items: { type: string }
      assetTypes:
        type: array
        items: { type: string }
  reports.SummaryResponse:
    type: object
    properties:
      cpf: { type: string }
      from: { type: string }
      to: { type: string }
      monthsWithTransactions: { type: integer }
      totalTransactions: { type: integer }
      tickersCount: { type: integer }
      positionsCount: { type: integer }
      grossValueBRLSum: { type: string }
      notes: { type: string }
  reports.TickersItem:
    type: object
    properties:
      ticker: { type: string }
      quantityTotal: { type: string }
  reports.TickersResponse:
    type: object
    properties:
      cpf: { type: string }
      from: { type: string }
      to: { type: string }
      tickers:
        type: array
        items:
          $ref: '#/definitions/reports.TickersItem'
  entities.WalletStatus:
    enum:
    - active
    - inactive
    - blocked
    - suspended
    type: string
    x-enum-varnames:
    - WalletStatusActive
    - WalletStatusInactive
    - WalletStatusBlocked
    - WalletStatusSuspended
  entities.WalletType:
    enum:
    - personal
    - business
    - corporate
    type: string
    x-enum-varnames:
    - WalletTypePersonal
    - WalletTypeBusiness
    - WalletTypeCorporate
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: Suporte API
    url: http://www.swagger.io/support
  description: Sistema de carteiras digitais multi-tenant desenvolvido em Go
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Suno Wallets API
  version: "1.0"
paths:
  /b3/reconciliation/scan:
    post:
      tags: [B3 Reconciliation]
      summary: Executa scan de inconsistências (admin-only)
      consumes: [application/json]
      parameters:
      - in: header
        name: X-Tenant-Id
        description: ID do inquilino (UUID)
        required: true
        type: string
      - in: header
        name: X-Admin-Secret
        description: Segredo admin (quando configurado)
        required: false
        type: string
      - in: body
        name: request
        required: true
        schema:
          type: object
          properties:
            cpf: { type: string }
            tickers:
              type: array
              items: { type: string }
            from: { type: string }
            to: { type: string }
            dryRun: { type: boolean }
            maxSamplesPerType: { type: integer }
            concurrency: { type: integer }
      produces: [application/json]
      responses:
        "200": { description: OK, schema: { type: object, additionalProperties: true } }
        "400": { description: Bad Request, schema: { type: object, additionalProperties: { type: string } } }
        "403": { description: Forbidden, schema: { type: object, additionalProperties: { type: string } } }
  /b3/reconciliation/inconsistencies:
    get:
      tags: [B3 Reconciliation]
      summary: Lista inconsistências
      parameters:
      - in: header
        name: X-Tenant-Id
        required: true
        type: string
      - in: query
        name: cpf
        type: string
      - in: query
        name: status
        type: string
      - in: query
        name: type
        type: string
      - in: query
        name: ticker
        type: string
      produces: [application/json]
      responses:
        "200": { description: OK, schema: { type: object, additionalProperties: true } }
        "400": { description: Bad Request, schema: { type: object, additionalProperties: { type: string } } }
  /b3/reconciliation/inconsistencies/{id}:
    get:
      tags: [B3 Reconciliation]
      summary: Detalhe de inconsistência
      parameters:
      - in: header
        name: X-Tenant-Id
        required: true
        type: string
      - in: path
        name: id
        required: true
        type: string
      produces: [application/json]
      responses:
        "200": { description: OK, schema: { type: object, additionalProperties: true } }
        "400": { description: Bad Request, schema: { type: object, additionalProperties: { type: string } } }

  /ops/manual:
    post:
      tags: [Manual Ops]
      summary: Cria operação USER_MANUAL
      parameters:
      - in: header
        name: X-Tenant-Id
        required: true
        type: string
      - in: body
        name: request
        required: true
        schema:
          type: object
          properties:
            cpf: { type: string }
            ticker: { type: string }
            assetType: { type: string }
            operationDate: { type: string }
            operationType: { type: string }
            quantity: { type: number }
            unitPrice: { type: number }
            currency: { type: string }
      responses:
        "200": { description: OK }
        "400": { description: Bad Request }
    put:
      tags: [Manual Ops]
      summary: Atualiza USER_MANUAL ativa
      parameters:
      - in: header
        name: X-Tenant-Id
        required: true
        type: string
      - in: path
        name: id
        required: true
        type: string
      - in: body
        name: request
        required: true
        schema: { type: object }
      responses:
        "200": { description: OK }
        "400": { description: Bad Request }
    delete:
      tags: [Manual Ops]
      summary: Soft delete de USER_MANUAL
      parameters:
      - in: header
        name: X-Tenant-Id
        required: true
        type: string
      - in: path
        name: id
        required: true
        type: string
      responses:
        "200": { description: OK }

  /ops/dedup/scan:
    post:
      tags: [Ops Dedup]
      summary: Gera candidatos de dedup
      parameters:
      - in: header
        name: X-Tenant-Id
        required: true
        type: string
      - in: body
        name: request
        required: true
        schema: { type: object }
      responses:
        "200": { description: OK }
        "400": { description: Bad Request }

  /ops/dedup/resolve:
    post:
      tags: [Ops Dedup]
      summary: Resolve candidatos (MERGE|OVERRIDE|IGNORE)
      parameters:
      - in: header
        name: X-Tenant-Id
        required: true
        type: string
      - in: body
        name: request
        required: true
        schema: { type: object }
      responses:
        "200": { description: OK }
        "400": { description: Bad Request }

  /ops/dedup/candidates:
    get:
      tags: [Ops Dedup]
      summary: Lista candidatos
      parameters:
      - in: header
        name: X-Tenant-Id
        required: true
        type: string
      - in: query
        name: cpf
        type: string
      - in: query
        name: status
        type: string
      responses:
        "200": { description: OK }
  /health/live:
    get:
      tags:
      - Observability
      summary: Liveness
      description: Verifica se o processo está vivo.
      produces:
      - application/json
      responses:
        "200":
          description: OK
  /health/ready:
    get:
      tags:
      - Observability
      summary: Readiness
      description: Verifica DB/Redis/Migrations; 200 somente se pronto.
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "503":
          description: Service Unavailable
  /health/details:
    get:
      tags:
      - Observability
      summary: Health details
      description: Status por componente, latências e counters.
      produces:
      - application/json
      responses:
        "200":
          description: OK
  /metrics:
    get:
      tags:
      - Observability
      summary: Prometheus metrics
      produces:
      - text/plain
      responses:
        "200":
          description: OK
  /b3/admin/reset-and-refetch:
    post:
      tags:
      - B3 Admin
      summary: Reset seguro (admin) e reingestão histórica com normalização
      consumes:
      - application/json
      parameters:
      - description: ID do inquilino (UUID)
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: Segredo admin (quando configurado)
        in: header
        name: X-Admin-Secret
        required: false
        type: string
      - in: body
        name: request
        required: true
        schema:
          type: object
          properties:
            cpf: { type: string }
            assetTypes: { type: array, items: { type: string } }
            dataTypes: { type: array, items: { type: string } }
            startOverride: { type: string }
            endOverride: { type: string }
            force: { type: boolean }
            dryRun: { type: boolean }
            mode: { type: string, enum: ["archive","hard-delete"] }
            confirm: { type: string }
            confirmHard: { type: string }
      produces:
      - application/json
      responses:
        "200":
          description: Sumário da execução
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Requisição inválida
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Acesso negado
          schema:
            additionalProperties:
              type: string
            type: object
  /b3/client/last-sync:
    get:
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: CPF
        in: query
        name: cpf
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Últimos marcos de sync por CPF
      tags:
      - B3 Sync
  /b3/client/status:
    get:
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: CPF
        in: query
        name: cpf
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
  /b3/client/sync-window:
    get:
      tags:
      - B3 Sync
      summary: Inspeção de janela de sync (somente leitura)
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: CPF
        in: query
        name: cpf
        required: true
        type: string
      - description: Tipo de dado
        in: query
        name: type
        required: true
        type: string
      - description: Desde (YYYY-MM-DD)
        in: query
        name: since
        required: false
        type: string
      - description: Até (YYYY-MM-DD)
        in: query
        name: end
        required: false
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
            additionalProperties: true
  /b3/admin/incremental-from-last:
    post:
      tags:
      - B3 Admin
      summary: Executa incremental a partir do último marco ou since
      consumes:
      - application/json
      parameters:
      - description: ID do inquilino (UUID)
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: Segredo admin (quando configurado)
        in: header
        name: X-Admin-Secret
        required: false
        type: string
      - in: body
        name: request
        required: true
        schema:
          type: object
          properties:
            cpf: { type: string }
            dataTypes: { type: array, items: { type: string } }
            assetTypes: { type: array, items: { type: string } }
            since: { type: string }
            endOverride: { type: string }
            dryRun: { type: boolean }
            force: { type: boolean }
            concurrency: { type: integer }
      produces:
      - application/json
      responses:
        "200":
          description: Sumário de execução incremental
          schema:
            type: object
            additionalProperties: true
        "400":
          description: Requisição inválida
          schema:
            type: object
            additionalProperties:
              type: string
        "403":
          description: Acesso negado
          schema:
            type: object
            additionalProperties:
              type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Consulta estado de sync por CPF
      tags:
      - B3 Sync
  /b3/fetch/historical:
    post:
      consumes:
      - application/json
      description: Busca e persiste RAW por janelas mensais, evitando duplicidade
        por hash
      parameters:
      - description: Parâmetros
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/b3.ingestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
  /b3/client/raw-date-range:
    get:
      tags:
      - B3 Reports
      summary: Intervalo temporal no RAW por CPF (somente leitura)
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: CPF (11 dígitos)
        in: query
        name: cpf
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/reports.RawDateRangeResponse'
        "400":
          description: Bad Request
          schema:
            type: object
            additionalProperties:
              type: string
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "500": { description: Internal Server Error }
  /b3/client/summary:
    get:
      tags:
      - B3 Reports
      summary: Sumário agregado por CPF e intervalo (somente leitura)
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: CPF (11 dígitos)
        in: query
        name: cpf
        required: true
        type: string
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/reports.SummaryResponse'
        "400":
          description: Bad Request
          schema:
            type: object
            additionalProperties:
              type: string
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "500": { description: Internal Server Error }
  /b3/client/tickers:
    get:
      tags:
      - B3 Reports
      summary: Consolidação por ticker no intervalo (somente leitura)
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: CPF (11 dígitos)
        in: query
        name: cpf
        required: true
        type: string
      - description: Data inicial (YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: Data final (YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      - description: Limite de linhas (1..1000)
        in: query
        name: limit
        required: false
        type: integer
      - description: Offset (>=0)
        in: query
        name: offset
        required: false
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/reports.TickersResponse'
        "400":
          description: Bad Request
          schema:
            type: object
            additionalProperties:
              type: string
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "500": { description: Internal Server Error }
        "400":
          description: Bad Request
          schema:
            type: object
            additionalProperties:
              type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ingestão histórica de RAW (transactions v2 / positions v3)
      tags:
      - B3 Data (Persistence)
  /b3/fetch/positions/preview:
    get:
      description: Busca posições por período e tipo de ativo na B3 e retorna o payload
        bruto (consolidado), sem persistir.
      parameters:
      - description: CPF (11 dígitos)
        example: "12345678901"
        in: query
        name: cpf
        required: true
        type: string
      - description: Data inicial (YYYY-MM-DD)
        example: "2024-01-01"
        in: query
        name: start
        required: true
        type: string
      - description: Data final (YYYY-MM-DD)
        example: "2024-01-31"
        in: query
        name: end
        required: true
        type: string
      - description: Tipo de ativo (equity...) — somente equity implementado agora
        example: equity
        in: query
        name: assetType
        type: string
      - description: Página inicial (>= 1), padrão 1
        example: 1
        in: query
        name: page
        type: integer
      - description: Se true, pagina até o fim
        example: false
        in: query
        name: fetchAllPages
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Exemplo de sucesso
          schema:
            $ref: '#/definitions/dto.PositionsPreviewResponse'
        "400":
          description: Parâmetros inválidos
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Não autorizado / Token inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Acesso negado / Sem permissão
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Limite de requisições excedido (Retry-After)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Erro interno do servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Preview de posições v3 (sem persistência)
      tags:
      - B3 Data
  /b3/fetch/transactions/preview:
    get:
      description: Busca transações por período e tipo de ativo na B3 e retorna o
        payload bruto (consolidado), sem persistir.
      parameters:
      - description: CPF (11 dígitos)
        example: "12345678901"
        in: query
        name: cpf
        required: true
        type: string
      - description: Data inicial (YYYY-MM-DD)
        example: "2024-01-01"
        in: query
        name: start
        required: true
        type: string
      - description: Data final (YYYY-MM-DD)
        example: "2024-01-31"
        in: query
        name: end
        required: true
        type: string
      - description: Tipo de ativo (equity|fii|bdr|...) — somente equity implementado
          agora
        example: equity
        in: query
        name: assetType
        type: string
      - description: Página inicial (>= 1), padrão 1
        example: 1
        in: query
        name: page
        type: integer
      - description: Se true, pagina até o fim
        example: false
        in: query
        name: fetchAllPages
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Exemplo de sucesso
          schema:
            $ref: '#/definitions/dto.TransactionsPreviewResponse'
        "400":
          description: Parâmetros inválidos
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Preview de transações v2 (sem persistência)
      tags:
      - B3 Data
  /b3/health/auth:
    get:
      description: Controlado por flag OBS_ALLOW_B3_AUTH_HEALTH. Quando habilitado,
        checa presença de configuração de OAuth/mTLS (sem vazar segredos).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: B3 auth health
      tags:
      - B3
  /b3/normalize/run:
    post:
      consumes:
      - application/json
      description: Converte payloads RAW em registros normalizados, mantendo linhagem
        (raw_id/sequence), com idempotência.
      parameters:
      - description: ID do inquilino (UUID)
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: Parâmetros de normalização
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/b3.normalizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Sumário: inserted, updated, skipped, errors, rawProcessed'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Requisição inválida
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Normalização de RAW (transactions v2 / positions v3)
      tags:
      - B3 Data (Normalization)
  /b3/sync/run:
    post:
      consumes:
      - application/json
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-Id
        required: true
        type: string
      - description: Parâmetros
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/b3.runRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Executa sync incremental (diário)
      tags:
      - B3 Sync
  /health:
    get:
      description: Verifica se a aplicação e seus serviços dependentes estão funcionando
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/controllers.HealthResponse'
      summary: Health check
      tags:
      - health
  /live:
    get:
      description: Verifica se a aplicação está viva (para Kubernetes)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Liveness check
      tags:
      - health
  /ready:
    get:
      description: Verifica se a aplicação está pronta para receber requisições
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Readiness check
      tags:
      - health
  /wallets:
    get:
      description: Lista carteiras com filtros opcionais e paginação
      parameters:
      - description: ID do inquilino
        in: header
        name: X-Tenant-ID
        required: true
        type: string
      - description: ID do proprietário
        in: query
        name: owner_id
        type: string
      - description: Status da carteira
        in: query
        name: status
        type: string
      - description: Tipo da carteira
        in: query
        name: type
        type: string
      - default: 1
        description: Página
        in: query
        name: page
        type: integer
      - default: 10
        description: Limite por página
        in: query
        name: limit
        type: integer
      - description: Busca por nome
        in: query
        name: search
        type: string
      - description: Campo para ordenação
        in: query
        name: sort_by
        type: string
      - description: Ordenação decrescente
        in: query
        name: sort_desc
